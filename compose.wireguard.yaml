# Managed multi-profile WireGuard mode. Alternative to compose.surfshark.yaml:
# NEVER enable the two VPN Compose overrides together.
# No Docker socket, no NET_ADMIN on yt-dlp-server, no VPN control port on host.
services:
  wireguard-gateway:
    build:
      context: .
      dockerfile: Dockerfile.vpn-gateway
    container_name: yt-dlp-wireguard-gateway
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "4545:4545"
    environment:
      SURFSHARK_CONTROL_API_KEY: ${SURFSHARK_CONTROL_API_KEY:?Set a strong secret in .env.surfshark}
      VPN_PROFILE_DIR: /profiles
    volumes:
      - /srv/yt-dlp-server/wireguard-profiles:/profiles
    restart: unless-stopped
    networks:
      default:
        aliases: [yt-dlp-server]
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.settimeout(2); s.connect(('127.0.0.1',8787)); s.close()"]
      interval: 10s
      timeout: 3s
      retries: 6

  yt-dlp-server:
    network_mode: "service:wireguard-gateway"
    ports: !reset []
    environment:
      VPN_GATEWAY_ENABLED: "1"
      SURFSHARK_CONTROL_API_KEY: ${SURFSHARK_CONTROL_API_KEY:?Set a strong secret in .env.surfshark}
      SURFSHARK_ROTATE_ON_403: ${SURFSHARK_ROTATE_ON_403:-0}
    depends_on:
      wireguard-gateway:
        condition: service_healthy
