# Optional Surfshark WireGuard transport for the downloader only.
# Enable with:
# docker compose --env-file .env.surfshark -f compose.yaml -f compose.surfshark.yaml up -d --build
# The default compose.yaml remains unchanged when this override is not used.
services:
  surfshark-vpn:
    image: qmcgaw/gluetun:v3
    container_name: yt-dlp-surfshark
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "4545:4545"
    environment:
      VPN_SERVICE_PROVIDER: surfshark
      VPN_TYPE: wireguard
      WIREGUARD_PRIVATE_KEY: ${SURFSHARK_WIREGUARD_PRIVATE_KEY:?Configure Surfshark WireGuard private key in .env.surfshark}
      WIREGUARD_ADDRESSES: ${SURFSHARK_WIREGUARD_ADDRESSES:?Configure Surfshark WireGuard address in .env.surfshark}
      SERVER_COUNTRIES: ${SURFSHARK_SERVER_COUNTRIES:-Netherlands}
      FIREWALL_INPUT_PORTS: "4545"
      # The control server is reachable ONLY on the shared internal network,
      # never published as a host port.
      HTTP_CONTROL_SERVER_AUTH_DEFAULT_ROLE: '{"auth":"apikey","apikey":"${SURFSHARK_CONTROL_API_KEY:?Configure a private VPN control API key}"}'
    networks:
      default:
        aliases:
          # Keep sibling containers' http://yt-dlp-server:4545 URLs usable.
          - yt-dlp-server
    restart: unless-stopped

  yt-dlp-server:
    network_mode: "service:surfshark-vpn"
    # Ports are instead published by surfshark-vpn to avoid conflicts.
    ports: !reset []
    environment:
      SURFSHARK_CONTROL_API_KEY: ${SURFSHARK_CONTROL_API_KEY:?Configure a private VPN control API key}
      SURFSHARK_VPN_ENABLED: "1"
    depends_on:
      surfshark-vpn:
        condition: service_healthy
