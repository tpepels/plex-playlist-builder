name: Playlist builder checks

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Python tests
        run: python -m pytest -q
      - name: Browser JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          content = Path("app/templates/index.html").read_text(encoding="utf-8")
          assert "<script>" in content and "</script>" in content
          Path("/tmp/playlist-builder-ui.js").write_text(
              content.split("<script>", 1)[1].split("</script>", 1)[0],
              encoding="utf-8",
          )
          PY
          node --check /tmp/playlist-builder-ui.js
