name: Playlist builder checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Playlist curation phases 1-4 (focused)
        run: |
          python -m pytest -q \
            tests/test_playlist_curator.py \
            tests/test_playlist_identity_ranking.py \
            tests/test_playlist_intelligence_api.py \
            tests/test_curation_library.py \
            tests/test_curation_impact.py \
            tests/test_curation_validation.py \
            tests/test_curation_stages_3_4_api.py \
            tests/test_curation_real_errors.py \
            tests/test_playlist_generation.py \
            tests/test_generation_publish.py \
            tests/test_generation_api.py \
            tests/test_site_navigation.py
      - name: Python tests
        run: python -m pytest -q tests
      - name: Browser JavaScript syntax
        if: ${{ always() }}
        run: |
          python - <<'PY'
          from pathlib import Path
          content = Path("app/templates/index.html").read_text(encoding="utf-8")
          assert "<script>" in content and "</script>" in content
          Path("/tmp/playlist-builder-ui.js").write_text(
              content.split("<script>", 1)[1].split("</script>", 1)[0],
              encoding="utf-8",
          )
          PY
          node --check /tmp/playlist-builder-ui.js
      - name: Browser import and sync flow tests
        if: ${{ always() }}
        run: node --test tests/test_import_ui.mjs
      - name: Playlist Intelligence browser integration
        if: ${{ always() }}
        run: node tests/test_playlist_intelligence_ui.mjs
      - name: Intelligent generation UI and APIs
        if: ${{ always() }}
        run: node tests/test_playlist_generator_ui.mjs
      - name: Shared navigation integration
        if: ${{ always() }}
        run: node tests/test_site_navigation.mjs
      - name: Validate coordinated root Compose
        run: |
          docker compose -f compose.yaml config --quiet
          python - <<'PY'
          import json
          import subprocess
          config = json.loads(subprocess.check_output(
              ["docker", "compose", "-f", "compose.yaml",
               "config", "--format", "json"], text=True,
          ))
          assert set(config["services"]) == {
              "plex-playlist-manager", "yt-dlp-server"
          }
          engine = config["services"]["yt-dlp-server"]
          assert not engine.get("ports")
          assert "NET_ADMIN" in engine["cap_add"]
          assert engine["build"]["context"].endswith("/yt-dlp-server")
          PY
      - name: Verify real parent Compose migration and VPN override move
        run: |
          set -eu
          root="$(mktemp -d)"
          mkdir -p "$root/plex-playlist-manager/yt-dlp-server" "$root/yt-dlp-server"
          cp yt-dlp-server/compose.parent-vpn.yaml             "$root/plex-playlist-manager/yt-dlp-server/compose.parent-vpn.yaml"
          cp yt-dlp-server/compose.parent-vpn.yaml             "$root/yt-dlp-server/compose.parent-vpn.yaml"
          ln -s "$root/yt-dlp-server/compose.parent-vpn.yaml"             "$root/docker-compose.override.yml"
          cat > "$root/docker-compose.yml" <<'YAML'
          services:
            yt-dlp-server:
              build:
                context: ./yt-dlp-server
              container_name: yt-dlp-server
              user: "1000:1000"
              ports:
                - "4545:4545"
              environment:
                TZ: Europe/Lisbon
                STATE_DIR: /data/state
              volumes:
                - /srv/completed/music:/data/music
                - /srv/yt-dlp-server/state:/data/state
                - /srv/yt-dlp-server/tmp:/data/tmp
            plex-playlist-manager:
              build:
                context: ./plex-playlist-manager
              ports:
                - "5051:8000"
              environment:
                PLEX_LIBRARY: Music
              volumes:
                - /srv/plex-playlist-manager:/data
            unrelated-app:
              image: busybox:latest
              command: ["true"]
          YAML
          python deploy/merge_media_stack.py --stack "$root"
          python deploy/merge_media_stack.py --stack "$root" --apply
          python deploy/merge_media_stack.py --stack "$root" --apply
          test "$(readlink -f "$root/docker-compose.override.yml")" =             "$root/plex-playlist-manager/yt-dlp-server/compose.parent-vpn.yaml"
          ROOT="$root" python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path
          root = Path(os.environ["ROOT"])
          result = subprocess.check_output([
              "docker", "compose", "-f", str(root/"docker-compose.yml"),
              "-f", str(root/"docker-compose.override.yml"),
              "config", "--format", "json",
          ], text=True)
          services = json.loads(result)["services"]
          assert set(services) == {
              "yt-dlp-server", "plex-playlist-manager", "unrelated-app"
          }
          downloader = services["yt-dlp-server"]
          assert downloader["build"]["context"] == str(
              root/"plex-playlist-manager"/"yt-dlp-server")
          assert not downloader.get("ports")
          assert "NET_ADMIN" in downloader["cap_add"]
          assert downloader["user"] == "0:0"
          assert services["plex-playlist-manager"]["ports"]
          assert services["unrelated-app"]["image"] == "busybox:latest"
          assert len(list(root.glob("*.pre-monorepo.*.bak"))) == 1
          PY
      - name: Home overview browser behavior
        if: ${{ always() }}
        run: node --test tests/test_home_ui.mjs
      - name: Build Playlist Manager Docker image
        run: docker build -t plex-playlist-builder:ci .
      - name: Verify live manager-to-downloader Docker network integration
        run: |
          set -eu
          docker network create monorepo-test-network
          trap 'docker rm -f monorepo-test-manager monorepo-test-engine >/dev/null 2>&1 || :; docker network rm monorepo-test-network >/dev/null 2>&1 || :' EXIT
          cat > /tmp/monorepo-test-engine.py <<'PY'
          import json
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

          class Handler(BaseHTTPRequestHandler):
              def send(self, data):
                  body = json.dumps(data).encode()
                  self.send_response(200)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)
              def do_GET(self):
                  if self.path.startswith("/api/jobs"):
                      self.send({"jobs": [{"id": "integration-1", "status": "queued"}]})
                  elif self.path.startswith("/health"):
                      self.send({"status": "ok"})
                  else:
                      self.send({"ok": True, "prefix": self.headers.get("X-Forwarded-Prefix", "")})
              def do_POST(self):
                  self.rfile.read(int(self.headers.get("Content-Length", "0")))
                  self.send({"ok": True, "queued": True})
          ThreadingHTTPServer(("0.0.0.0", 4545), Handler).serve_forever()
          PY
          docker run -d --name monorepo-test-engine --network monorepo-test-network             --network-alias yt-dlp-server             -v /tmp/monorepo-test-engine.py:/tmp/monorepo-test-engine.py:ro             plex-playlist-builder:ci python -u /tmp/monorepo-test-engine.py
          docker run -d --name monorepo-test-manager --network monorepo-test-network             -e DOWNLOAD_BRIDGE_SCAN_ENABLED=0             -e YTDLP_SERVER_URL=http://yt-dlp-server:4545             plex-playlist-builder:ci
          docker exec -i monorepo-test-manager python - <<'PY'
          import json
          import time
          from urllib.request import Request, urlopen
          from urllib.error import URLError

          base = "http://127.0.0.1:8000"
          for attempt in range(25):
              try:
                  with urlopen(base + "/downloads", timeout=3) as response:
                      page = response.read().decode()
                  assert 'src="/downloads/engine/"' in page
                  break
              except URLError:
                  if attempt == 24:
                      raise
                  time.sleep(1)

          with urlopen(base + "/downloads/engine/health", timeout=5) as response:
              assert json.load(response)["status"] == "ok"
          with urlopen(base + "/downloads/engine/", timeout=5) as response:
              assert json.load(response)["prefix"] == "/downloads/engine"
          with urlopen(base + "/api/downloads/bridge/status", timeout=5) as response:
              counts = json.load(response)
          assert counts["ok"] is True, counts
          assert counts["counts"]["queued"] == 1
          action = Request(
              base + "/downloads/engine/api/probe",
              data=json.dumps({"url":"https://example.test/video"}).encode(),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urlopen(action, timeout=5) as response:
              assert json.load(response)["queued"] is True
          PY
      - name: Smoke-test unified downloads inside built image
        run: |
          docker run --rm -i \
            -e DOWNLOAD_BRIDGE_SCAN_ENABLED=0 \
            -e YTDLP_SERVER_URL=http://127.0.0.1:4545 \
            plex-playlist-builder:ci python - <<'PY'
          from fastapi.testclient import TestClient
          from app.main import app

          with TestClient(app) as client:
              home = client.get("/")
              assert home.status_code == 200
              assert "Your music." in home.text
              assert 'id="siteNavigationToggle"' in home.text
              playlist = client.get("/playlists?view=health")
              assert playlist.status_code == 200
              assert 'id="viewHealth"' in playlist.text
              portal = client.get("/downloads?job=sample123")
              assert portal.status_code == 200
              assert 'src="/downloads/engine/?job=sample123"' in portal.text
              assert "Scan Plex for new music" in portal.text
              unavailable = client.get("/api/downloads/bridge/status")
              assert unavailable.status_code == 503, unavailable.text
              assert unavailable.json()["engine"] == "offline"
          PY

  downloader-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: yt-dlp-server
    env:
      MUSIC_ROOT: /tmp/yt-dlp-ci-music
      TEMP_DIR: /tmp/yt-dlp-ci-staging
      STATE_DIR: /tmp/yt-dlp-ci-state
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install offline downloader test dependencies
        run: python -m pip install -q pytest flask mutagen
      - name: Compile downloader sources
        run: python -m py_compile app.py staging.py album_completeness.py album_failure.py retry_queue.py job_history.py download_resilience.py job_diagnostics.py surfshark_vpn.py vpn_ui.py vpn_gateway.py youtube_cookies.py library_repair.py extension_package.py container_runtime.py state_store.py process_lifecycle.py
      - name: Downloader Python regressions
        run: python -m pytest -q tests/test_album_completeness.py tests/test_album_failure.py tests/test_bulk_retry.py tests/test_job_history.py tests/test_job_diagnostics.py tests/test_download_resilience.py tests/test_surfshark_vpn.py tests/test_vpn_gateway.py tests/test_vpn_direct_first.py tests/test_one_container.py tests/test_failstates.py tests/test_process_lifecycle.py tests/test_publication_transactions.py tests/test_signal_console_ui.py tests/test_youtube_cookies.py tests/test_script_consolidation.py tests/test_cookie_verification.py tests/test_proxy_mount.py
      - name: Downloader browser regressions
        run: node --test tests/test_download_ui.mjs tests/test_download_history_ui.mjs tests/test_retry_all_ui.mjs tests/test_vpn_ui.mjs
