name: Playlist builder checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Playlist curation phases 1-4 (focused)
        run: |
          python -m pytest -q \
            tests/test_playlist_curator.py \
            tests/test_playlist_identity_ranking.py \
            tests/test_playlist_intelligence_api.py \
            tests/test_curation_library.py \
            tests/test_curation_impact.py \
            tests/test_curation_validation.py \
            tests/test_curation_stages_3_4_api.py \
            tests/test_curation_real_errors.py \
            tests/test_playlist_generation.py \
            tests/test_generation_publish.py \
            tests/test_generation_api.py \
            tests/test_site_navigation.py
      - name: Python tests
        run: python -m pytest -q
      - name: Browser JavaScript syntax
        if: ${{ always() }}
        run: |
          python - <<'PY'
          from pathlib import Path
          content = Path("app/templates/index.html").read_text(encoding="utf-8")
          assert "<script>" in content and "</script>" in content
          Path("/tmp/playlist-builder-ui.js").write_text(
              content.split("<script>", 1)[1].split("</script>", 1)[0],
              encoding="utf-8",
          )
          PY
          node --check /tmp/playlist-builder-ui.js
      - name: Browser import and sync flow tests
        if: ${{ always() }}
        run: node --test tests/test_import_ui.mjs
      - name: Playlist Intelligence browser integration
        if: ${{ always() }}
        run: node tests/test_playlist_intelligence_ui.mjs
      - name: Intelligent generation UI and APIs
        if: ${{ always() }}
        run: node tests/test_playlist_generator_ui.mjs
      - name: Shared navigation integration
        if: ${{ always() }}
        run: node tests/test_site_navigation.mjs
      - name: Build Playlist Manager Docker image
        run: docker build -t plex-playlist-builder:ci .
      - name: Smoke-test unified downloads inside built image
        run: |
          docker run --rm -i \
            -e DOWNLOAD_BRIDGE_SCAN_ENABLED=0 \
            -e YTDLP_SERVER_URL=http://127.0.0.1:4545 \
            plex-playlist-builder:ci python - <<'PY'
          from fastapi.testclient import TestClient
          from app.main import app

          with TestClient(app) as client:
              portal = client.get("/downloads?job=sample123")
              assert portal.status_code == 200
              assert 'src="/downloads/engine/?job=sample123"' in portal.text
              assert "Scan Plex for new music" in portal.text
              unavailable = client.get("/api/downloads/bridge/status")
              assert unavailable.status_code == 503, unavailable.text
              assert unavailable.json()["engine"] == "offline"
          PY
