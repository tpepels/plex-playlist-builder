# Single managed container: root WireGuard controller, unprivileged web/yt-dlp.
# Persistent music, state, staging, and profile mounts are unchanged.
services:
  yt-dlp-server:
    build: .
    container_name: yt-dlp-server
    user: "0:0"
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      net.ipv4.conf.all.src_valid_mark: "1"
    ports:
      - "4545:4545"
    environment:
      TZ: ${TZ:-Europe/Lisbon}
      PORT: 4545
      MUSIC_ROOT: /data/music
      IMPORT_SUBDIR: YT-DLP Imports
      STATE_DIR: /data/state
      TEMP_DIR: /data/tmp
      VPN_GATEWAY_ENABLED: "1"
      VPN_PROFILE_DIR: /profiles
      VPN_CONTROL_TOKEN_FILE: /data/state/.vpn-control-token
      VPN_DOWNLOADER_UID: ${UID:-1000}
      VPN_DOWNLOADER_GID: ${GID:-1000}
      SURFSHARK_ROTATE_ON_403: ${SURFSHARK_ROTATE_ON_403:-1}
    volumes:
      - /srv/completed/music:/data/music
      - /srv/yt-dlp-server/state:/data/state
      - /srv/yt-dlp-server/tmp:/data/tmp
      - /srv/yt-dlp-server/wireguard-profiles:/profiles
    restart: unless-stopped
