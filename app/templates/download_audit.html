<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Downloadcontrole · Plex Playlist Builder</title>
<style>
:root{color-scheme:dark;font:15px/1.5 system-ui,sans-serif;background:#111315;color:#f0f2f4}
body{margin:0}main{max-width:1050px;margin:35px auto;padding:0 20px 50px}
h1{font-size:26px;margin:12px 0 4px}p{margin:5px 0 14px;color:#afb8c2}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:22px 0}
input,button{font:inherit;padding:9px 12px;border:1px solid #50575c;border-radius:8px;background:#22262a;color:#f2f2f2}
input{flex:1;min-width:190px}button{cursor:pointer}
button:disabled{opacity:.5;cursor:progress}
a{color:#b8d4ff}
.cards{display:grid;gap:12px}.card{border:1px solid #3c444c;background:#1c2025;padding:16px;border-radius:11px}
.card h2{font-size:17px;margin:0 0 6px}.card p{margin:4px 0}
.metrics{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.metric{padding:8px 12px;background:#22262a;border-radius:7px}
.status{font-size:12px;font-weight:700;color:#d4c5a8}
.status.indexed{color:#89d7a3}.status.missing_from_plex,.status.partially_indexed{color:#ff9d94}
.status.metadata_required{color:#efce7f}
.metadata{color:#aab1ba;font-size:13px}
.path{font:12px/1.45 ui-monospace,monospace;overflow-wrap:anywhere;color:#acb4c1}
#notice{min-height:22px;margin:15px 0;color:#e9d08c}
ul{padding-left:21px;color:#c1c8cf;font-size:13px}
label{font-size:13px;color:#bbc2ca}
@media(max-width:680px){main{padding:0 12px}.toolbar{align-items:stretch}button{min-height:42px}}
</style>
</head>
<body>
<main>
<a href="/">← Playlist Manager</a>
<h1>Downloadcontrole</h1>
<p>Controleer of yt-dlp-bestanden daadwerkelijk door Plex zijn geïndexeerd. Vergelijking gebeurt op bestandslocatie, ook wanneer Plex een klassieke opname onder een andere uitvoerder of albumtitel toont.</p>
<form id="audit-form" class="toolbar">
  <input id="query" name="q" type="search" placeholder="Zoek op Beethoven, album, artiest of job-ID" aria-label="Zoek in downloadgeschiedenis">
  <button type="submit" id="check">Controleren</button>
  <button type="button" id="scan">Plex-bibliotheek scannen</button>
</form>
<div id="notice" role="status" aria-live="polite">Downloadgeschiedenis en Plex-index worden vergeleken…</div>
<div id="metrics" class="metrics"></div>
<div id="results" class="cards"></div>
<p id="limits"></p>
<script>
(() => {
  const form = document.getElementById("audit-form");
  const query = document.getElementById("query");
  const button = document.getElementById("check");
  const scan = document.getElementById("scan");
  const notice = document.getElementById("notice");
  const results = document.getElementById("results");
  const metrics = document.getElementById("metrics");
  const limits = document.getElementById("limits");
  const downloader = {{ downloader_url | tojson }};
  query.value = new URLSearchParams(location.search).get("q") || "";

  function div(cls, value) {
    const node = document.createElement("div");
    node.className = cls;
    node.textContent = value;
    return node;
  }
  function link(url, value) {
    const node = document.createElement("a");
    node.href = url;
    node.textContent = value;
    node.target = "_blank";
    node.rel = "noopener noreferrer";
    return node;
  }
  function showResults(data) {
    results.replaceChildren();
    metrics.replaceChildren();
    metrics.append(
      div("metric", data.jobs_considered + " relevante jobs"),
      div("metric", (data.counts.indexed || 0) + " volledig in Plex"),
      div("metric", (data.counts.missing_from_plex || 0) + " niet in Plex-index"),
      div("metric", (data.counts.partially_indexed || 0) + " gedeeltelijk"),
      div("metric", ((data.counts.missing_on_disk || 0) +
          (data.counts.partially_missing_on_disk || 0)) + " bestanden ontbreken"),
      div("metric", (data.counts.metadata_required || 0) + " metadata nodig"),
      div("metric", (data.counts.in_progress || 0) + " bezig")
    );
    const labels = {
      indexed: "Alle bestanden in Plex gevonden",
      missing_from_plex: "Gepubliceerd, maar ontbreekt in Plex",
      partially_indexed: "Slechts een deel in Plex",
      missing_on_disk: "Gepubliceerde bestanden ontbreken op schijf",
      partially_missing_on_disk: "Sommige bestanden ontbreken op schijf",
      metadata_required: "Wacht op metadata in yt-dlp",
      in_progress: "Nog aan het downloaden",
      not_published: "Niet gepubliceerd",
      unverifiable_paths: "Bestandspaden niet verifieerbaar",
      no_published_files: "Geen gepubliceerde bestanden geregistreerd"
    };
    for (const job of data.items) {
      const card = document.createElement("article");
      card.className = "card";
      const heading = document.createElement("h2");
      heading.textContent = (job.artist ? job.artist + " — " : "") + job.title;
      const state = div("status " + job.outcome,
        (labels[job.outcome] || job.outcome) + " · yt-dlp: " + job.status);
      const why = div("metadata", job.reason);
      const ratio = div("metadata",
        "Plex heeft " + job.files_indexed + " van " + job.files_recorded +
        " geregistreerde publicatiebestanden geïndexeerd.");
      card.append(heading, state, why, ratio);
      if (job.files_on_disk !== null) {
        card.append(div("metadata", "Bestanden op yt-dlp-schijf: " +
          job.files_on_disk + " aanwezig · " + job.files_missing_on_disk + " ontbreken."));
      }
      if (job.staged_audio_on_disk > 0) {
        card.append(div("metadata", "Nog in staging: " +
          job.staged_audio_on_disk + " audiobestand(en)."));
      }
      if (job.requested) card.append(div("metadata", "Gevraagd album: " + job.requested));
      if (job.final_dir) card.append(div("path", "Opgeslagen onder: " + job.final_dir));
      if (job.plex_labels.length) {
        const title = div("metadata", "In Plex gevonden als:");
        card.append(title);
        for (const tag of job.plex_labels) {
          card.append(div("metadata", (tag.artist || "Onbekende artiest") + " — " +
            (tag.album || "Onbekend album")));
        }
      }
      if (job.unmatched_files.length) {
        const list = document.createElement("details");
        const summary = document.createElement("summary");
        summary.textContent = "Niet-gematchte bestanden (" + job.unmatched_files.length + " getoond)";
        const items = document.createElement("ul");
        for (const file of job.unmatched_files) {
          const row = document.createElement("li");
          row.textContent = file;
          items.append(row);
        }
        list.append(summary, items);
        card.append(list);
      }
      const controls = div("metadata", "");
      controls.append(link(downloader + "?job=" + encodeURIComponent(job.job_id),
        "Open downloadjob"));
      if (job.source_url) {
        controls.append(document.createTextNode(" · "));
        controls.append(link(job.source_url, "Bron"));
      }
      card.append(controls);
      results.append(card);
    }
    if (!data.items.length) {
      results.append(div("metadata", "Geen downloadjobs gevonden voor deze zoekterm. " +
        "Mogelijk is de job uit de yt-dlp-geschiedenis verwijderd."));
    }
    limits.textContent = data.limitations +
      (data.plex_music_locations?.length
        ? " Plex Music-bibliotheeklocaties: " + data.plex_music_locations.join(" ; ")
        : " Plex Music-bibliotheeklocaties konden niet worden uitgelezen.");
    if (data.plex_import_files_indexed === 0 &&
        data.items.some(item => item.final_dir && item.files_on_disk > 0)) {
      const warning = div("metadata", "Plex indexeert momenteel geen enkel bestand onder YT-DLP Imports. " +
        "Controleer of deze directory werkelijk binnen de Plex Music-bibliotheek valt en " +
        "of beide containers dezelfde muziekbestanden zien.");
      metrics.append(warning);
    }
    notice.textContent = "Controle gereed: " + data.jobs_considered +
      " jobs gecontroleerd tegen de huidige Plex-index.";
  }
  async function check() {
    button.disabled = true;
    notice.textContent = "Downloadgeschiedenis ophalen en Plex-bestanden vergelijken…";
    try {
      const q = query.value.trim();
      history.replaceState(null, "", "/downloads-audit" + (q ? "?q=" + encodeURIComponent(q) : ""));
      const response = await fetch("/api/download-audit?q=" + encodeURIComponent(q), {cache:"no-store"});
      const data = await response.json();
      if (!response.ok) throw Error(data.detail || "De controle kon niet worden uitgevoerd.");
      showResults(data);
    } catch (error) {
      notice.textContent = "Controle mislukt: " + error.message;
      results.replaceChildren();
    } finally {
      button.disabled = false;
    }
  }
  form.addEventListener("submit", event => { event.preventDefault(); check(); });
  scan.addEventListener("click", async () => {
    scan.disabled = true;
    notice.textContent = "Plex-scan aanvragen…";
    try {
      const response = await fetch("/api/download-audit/scan",
        {method:"POST",headers:{"Accept":"application/json"}});
      const data = await response.json();
      if (!response.ok) throw Error(data.detail || "Scannen mislukt.");
      notice.textContent = "Plex-scan aangevraagd. Indexering kan nog lopen; gebruik Controleren om later opnieuw te vergelijken.";
    } catch (error) {
      notice.textContent = "Scannen mislukt: " + error.message;
    } finally {
      scan.disabled = false;
    }
  });
  check();
})();
</script>
</main></body></html>
