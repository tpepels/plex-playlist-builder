<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plex Playlist Manager</title>
<style>
:root { color-scheme: dark; --bg:#111; --panel:#191919; --line:#333; --text:#eee; --muted:#aaa; --accent:#e5a00d; --bad:#ff7878; --good:#82d982; }
* { box-sizing: border-box; }
body { margin:0; font:15px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:var(--bg); color:var(--text); }
main { max-width:1180px; margin:0 auto; padding:28px 20px 60px; }
h1 { margin:0 0 4px; font-size:28px; }
.sub { color:var(--muted); margin-bottom:22px; }
.grid { display:grid; grid-template-columns:minmax(0, 1.15fr) minmax(320px,.85fr); gap:18px; }
.panel { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px; }
textarea { width:100%; min-height:610px; resize:vertical; background:#0b0b0b; color:#ddd; border:1px solid var(--line); border-radius:8px; padding:12px; font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace; }
button, select { background:#242424; color:#eee; border:1px solid #444; border-radius:7px; padding:9px 12px; }
button { cursor:pointer; }
button.primary { background:var(--accent); border-color:var(--accent); color:#111; font-weight:650; }
.row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:12px; }
.row select { flex:1; min-width:180px; }
.status { padding:10px 12px; border-radius:8px; background:#101010; margin-bottom:12px; white-space:pre-wrap; }
.status.good { border-left:3px solid var(--good); }
.status.bad { border-left:3px solid var(--bad); }
pre { margin:0; white-space:pre-wrap; word-break:break-word; background:#0b0b0b; border-radius:8px; padding:12px; max-height:520px; overflow:auto; }
small { color:var(--muted); }
@media (max-width:850px) { .grid { grid-template-columns:1fr; } textarea { min-height:440px; } }
</style>
</head>
<body>
<main>
  <h1>Plex Playlist Manager</h1>
  <div class="sub">Edit YAML, preview Plex matches, then sync. Sync replaces the Plex playlist with the YAML-defined order.</div>
  <div class="grid">
    <section class="panel">
      <div class="row">
        <button id="save" class="primary">Save YAML</button>
        <button id="reload">Reload</button>
        <small id="saveState"></small>
      </div>
      <textarea id="yaml" spellcheck="false"></textarea>
    </section>
    <section class="panel">
      <div id="health" class="status">Checking Plex…</div>
      <div class="row">
        <select id="playlist"></select>
        <button id="preview">Preview</button>
        <button id="sync" class="primary">Sync selected</button>
      </div>
      <div class="row"><button id="syncAll">Sync all enabled playlists</button></div>
      <pre id="output">No preview yet.</pre>
    </section>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
async function json(url, options={}) {
  const r = await fetch(url, options);
  const body = await r.json().catch(()=>({detail:`HTTP ${r.status}`}));
  if (!r.ok) throw new Error(body.detail || JSON.stringify(body));
  return body;
}
function setPlaylists(names) {
  const old = $('playlist').value;
  $('playlist').innerHTML = '';
  for (const name of names) {
    const o = document.createElement('option'); o.value=name; o.textContent=name; $('playlist').appendChild(o);
  }
  if (names.includes(old)) $('playlist').value=old;
}
async function loadConfig() {
  const d = await json('/api/config');
  $('yaml').value = d.text; setPlaylists(d.playlists);
}
async function checkHealth() {
  const d = await json('/api/health');
  $('health').className='status ' + (d.ok ? 'good':'bad');
  $('health').textContent = d.ok ? `Connected: ${d.server}\nLibrary: ${d.library}\nPlex: ${d.version}` : `Plex error: ${d.error}`;
}
$('save').onclick = async () => {
  try {
    const d = await json('/api/config',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:$('yaml').value})});
    setPlaylists(d.playlists); $('saveState').textContent='Saved.';
  } catch(e) { $('saveState').textContent='Error: '+e.message; }
};
$('reload').onclick = loadConfig;
$('preview').onclick = async () => {
  try { $('output').textContent='Matching…'; $('output').textContent=JSON.stringify(await json('/api/preview/'+encodeURIComponent($('playlist').value)),null,2); }
  catch(e) { $('output').textContent='Error: '+e.message; }
};
$('sync').onclick = async () => {
  if (!confirm(`Replace Plex playlist “${$('playlist').value}” from YAML?`)) return;
  try { $('output').textContent='Syncing…'; $('output').textContent=JSON.stringify(await json('/api/sync/'+encodeURIComponent($('playlist').value),{method:'POST'}),null,2); }
  catch(e) { $('output').textContent='Error: '+e.message; }
};
$('syncAll').onclick = async () => {
  if (!confirm('Sync all enabled playlists?')) return;
  try { $('output').textContent='Syncing…'; $('output').textContent=JSON.stringify(await json('/api/sync-all',{method:'POST'}),null,2); }
  catch(e) { $('output').textContent='Error: '+e.message; }
};
loadConfig().catch(e=>$('output').textContent='Config error: '+e.message);
checkHealth().catch(e=>$('health').textContent='Health error: '+e.message);
</script>
</body>
</html>
