<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plex Playlist Builder</title>
<style>
:root { color-scheme:dark; --bg:#101113; --panel:#1b1d21; --surface:#25272d; --line:#373941; --text:#f4f4f6; --muted:#aeb1b9; --accent:#e5a00d; --good:#8ed69f; --bad:#ff9393; --warning:#e8bb63; }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:1120px;margin:0 auto;padding:20px 22px 55px}
h1{font-size:26px;margin:0 0 10px}
h2{font-size:19px;margin:0 0 5px}
.sub{color:var(--muted);margin:4px 0 20px}
.status,.panel,.card,.compare{border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.status{display:inline-flex;align-items:center;gap:9px;padding:6px 11px;margin:0 0 12px;font-size:13px}
.dot{width:9px;height:9px;border-radius:50%;background:#888;flex-shrink:0}
.status.good .dot{background:var(--good)} .status.bad .dot{background:var(--bad)}
.panel{padding:15px 17px;margin:12px 0}
.panel-header{display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:14px}
.kicker{font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);font-weight:750}
.version-name{font-size:18px;font-weight:700;overflow-wrap:anywhere}
.version-detail{color:var(--muted);margin:5px 0 0;max-width:750px}
.id{font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;color:#d0d3da;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:5px 8px;white-space:nowrap}
.metrics{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px}
.metric{font-size:13px;color:var(--muted);white-space:nowrap}
.metric strong{font-size:15px;color:var(--text);margin-right:5px;font-variant-numeric:tabular-nums}
.metric span{color:var(--muted);font-size:12px}
.help{font-size:12px;color:var(--muted);margin:12px 0 0}
.controls{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.recent-form{display:flex;align-items:center;gap:9px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.recent-form label{color:var(--muted);font-size:13px}
.recent-form input,.recent-form select{background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit}
.recent-form input{width:85px}
.recent-form select{min-width:145px}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button,.button{appearance:none;border:1px solid #55575e;border-radius:8px;padding:9px 12px;background:#303239;color:var(--text);cursor:pointer;font:inherit;text-decoration:none;display:inline-block}
button:hover,.button:hover{background:#41434b}
button.primary{background:var(--accent);border-color:var(--accent);color:#171717;font-weight:750}
button:disabled{opacity:.5;cursor:default}
.notice{margin:12px 0;padding:12px 14px;border-radius:8px;border:1px solid #335740;background:#182b20;color:#c9edcf}
.notice.error{border-color:#704444;background:#301e1e;color:#ffd0d0}
[hidden]{display:none!important}
.compare{padding:18px;margin:14px 0;border-color:#8f763f;background:#24221e}
.compare p{margin:5px 0 12px;color:var(--muted)}
.compare-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.compare-cell{border:1px solid #4a453b;border-radius:8px;padding:9px}
.compare-cell strong{font-size:21px;display:block}
.compare-cell span{color:var(--muted);font-size:12px}
.compare-list{margin:12px 0 0;color:var(--muted);overflow-wrap:anywhere}
.section-title{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:21px 0 12px}
.section-title h2{margin:0}
.list{display:grid;grid-template-columns:1fr;gap:7px}
.playlist{border:1px solid var(--line);background:var(--panel);border-radius:10px;overflow:hidden}
.playlist>summary{cursor:pointer;display:flex;align-items:center;gap:12px;padding:12px 15px;list-style:none;min-height:54px}
.playlist>summary::-webkit-details-marker{display:none}
.playlist>summary:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.playlist>summary:hover{background:#25272c}
.playlist>summary::before{content:"›";color:var(--muted);font-size:23px;line-height:1;transition:transform .12s}
.playlist[open]>summary::before{transform:rotate(90deg)}
.playlist-name{font-size:15px;font-weight:700;min-width:0;overflow-wrap:anywhere;flex:1}
.playlist-meta{font-size:12px;color:var(--muted);white-space:nowrap}
.playlist-body{padding:12px 16px 16px 39px;border-top:1px solid var(--line)}
.playlist-body .description{font-size:13px;color:var(--muted);margin-bottom:9px}
.playlist-body ul{list-style:none;padding:0;margin:4px 0 14px}
.playlist-body li{font-size:13px;padding:5px 0;border-top:1px solid #303239}
.playlist-body li:first-child{border-top:0}
.playlist-body li span{color:var(--muted)}
.playlist-body .more{font-size:12px;color:var(--muted);margin-bottom:10px}
.bulk-panel{margin-top:12px}
.bulk-head{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.bulk-head h2{margin:0;font-size:16px}
.bulk-progress{border-top:1px solid var(--line);margin-top:16px;padding-top:15px}
.bulk-progress progress{width:100%;height:11px;accent-color:var(--accent)}
.bulk-current{margin:8px 0;color:var(--muted);font-size:13px}
.bulk-errors{color:var(--bad);white-space:pre-wrap;overflow-wrap:anywhere;margin-top:10px;font-size:13px}
.playlist-tools{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:12px 0}
.playlist-tools input{min-width:240px;flex:1;max-width:410px;background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:9px 11px;font:inherit}
.playlist-tools label{color:var(--muted);font-size:13px;display:flex;gap:7px;align-items:center}

.chip{font-size:11px;font-weight:700;line-height:1.35;border-radius:7px;padding:6px 8px;white-space:nowrap;background:#343941;color:#d8dbe3}
.chip.needs_sync{background:#41321a;color:#f5ce85}
.chip.synced{background:#1d3b28;color:#afe5b9}
.result{font-size:13px;margin-top:10px}
.result.info{color:#c8ddf4}.result.bad{color:var(--bad)}
details.advanced{margin-top:24px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
details.advanced summary{cursor:pointer;padding:14px 16px}
.advanced-body{padding:0 16px 16px}
textarea{width:100%;min-height:360px;resize:vertical;background:#111215;color:#e4e4e7;border:1px solid var(--line);border-radius:8px;padding:12px;font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}
small{color:var(--muted)}
.empty{padding:22px;color:var(--muted);border:1px dashed #555;border-radius:10px}
@media(max-width:720px){main{padding:16px 13px 40px}.playlist-meta{white-space:normal}.playlist>summary{flex-wrap:wrap}.playlist-body{padding-left:16px}.recent-form{align-items:center}}
</style>
</head>
<body>
<main>
<h1>Plex Playlist Builder</h1>
<div id="health" class="status"><span class="dot"></span>Connecting to Plex…</div>

<section class="panel" aria-label="Loaded playlist version" aria-live="polite">
  <div class="panel-header">
    <div>
      <div class="kicker">Loaded YAML</div>
      <div class="version-name" id="versionName">Reading saved definitions…</div>
      <p class="version-detail" id="versionDetail"></p>
    </div>
    <span class="id" id="versionId" title="Content fingerprint (not a date)">—</span>
  </div>
  <div id="versionMetrics" class="metrics"></div>
</section>

<section class="panel" aria-label="Import and export">
  <div class="actions">
    <button id="importPack" class="primary" title="Validate YAML, import, and sync changes to Plex">Import &amp; sync</button>
    <input id="packFile" type="file" accept=".yml,.yaml,text/yaml,text/plain" hidden>
    <a class="button" href="/api/library-export.tsv" download="plex-music-library.tsv">Full library TSV</a>
    <a class="button" href="/api/playlists-export.yml" download="plex-playlists.yml">Plex playlists YAML</a>
  </div>
  <form id="recentForm" action="/api/library-recent.tsv" method="get" class="recent-form" aria-label="Export recently added music">
    <label for="recentMode">New music</label>
    <select id="recentMode" name="mode" aria-label="Recent music selection">
      <option value="hours">Last hours</option>
      <option value="albums">Latest albums</option>
    </select>
    <input id="recentLimit" name="limit" type="number" min="1" max="8760" value="48" required aria-label="Number of hours">
    <button type="submit" title="Export selected tracks with Plex rating keys">Download TSV</button>
  </form>
</section>
<div id="notice" class="notice" role="status" hidden></div>

<section id="bulkPanel" class="panel bulk-panel" aria-label="Plex updates" hidden>
  <div class="bulk-head">
    <div>
      <h2>Plex updates</h2>
      <small id="bulkSummary"></small>
    </div>
    <button id="syncPending" class="primary" disabled>Sync pending</button>
  </div>
  <div id="bulkProgress" class="bulk-progress" hidden aria-live="polite">
    <progress id="bulkBar" max="1" value="0"></progress>
    <div class="bulk-current" id="bulkCurrent"></div>
    <button id="stopSync" type="button" hidden>Stop after current</button>
    <div class="bulk-errors" id="bulkErrors" role="alert"></div>
  </div>
</section>

<div class="section-title"><h2>Playlists</h2><small id="listHint"></small></div>
<div class="playlist-tools">
  <input id="searchPlaylists" type="search" placeholder="Search playlists…" aria-label="Search playlists">
  <label><input id="onlyPending" type="checkbox"> Pending only</label>
  <button id="expandAll" type="button">Expand all</button>
</div>
<section id="cards" class="list" aria-label="Playlists"></section>

<details class="advanced">
  <summary>Advanced · YAML editor</summary>
  <div class="advanced-body">
    <textarea id="yaml" spellcheck="false"></textarea>
    <div class="row">
      <button id="save">Save YAML</button>
      <button id="reload">Discard</button>
      <small id="saveState"></small>
    </div>
  </div>
</details>
</main>
<script>
const $ = id => document.getElementById(id);
let config = null;
let editorDirty = false;
let syncing = false;
let stopRequested = false;

async function api(url, options={}) {
  const r = await fetch(url, options);
  const body = await r.json().catch(() => ({detail: `HTTP ${r.status}`}));
  if (!r.ok) throw new Error(body.detail || body.error || JSON.stringify(body));
  return body;
}
function esc(value) {
  return String(value ?? "").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
}
function dateLabel(value) {
  if (!value) return "date unknown";
  const d = new Date(value);
  return Number.isNaN(d.getTime()) ? "date unknown" : d.toLocaleString();
}
function showNotice(message, error=false) {
  $("notice").hidden = false;
  $("notice").className = error ? "notice error" : "notice";
  $("notice").textContent = message;
}
function clearNotice() { $("notice").hidden = true; }
function renderVersion(v) {
  const last = v.last_import;
  $("versionId").textContent = "ID " + v.id;
  if (last?.matches_loaded) {
    $("versionName").textContent = last.filename;
    $("versionDetail").textContent = `Imported ${dateLabel(last.imported_at)}`;
  } else if (last) {
    $("versionName").textContent = "Saved playlist definitions";
    $("versionDetail").textContent = `Edited since import · ${dateLabel(v.file_modified_at)}`;
  } else {
    $("versionName").textContent = "Saved playlist definitions";
    $("versionDetail").textContent = `Saved ${dateLabel(v.file_modified_at)}`;
  }
  const counts = v.counts || {};
  $("versionMetrics").innerHTML = [
    [counts.total ?? 0, "playlists"],
    [counts.synced ?? 0, "synced"],
    [counts.needs_sync ?? 0, "pending"],
    [counts.unverified ?? 0, "unverified"]
  ].map(([value,label]) => `<div class="metric"><strong>${value}</strong><span>${label}</span></div>`).join("");
}
function cardItems(items) {
  return items.slice(0, 5).map(item => {
    const title = item.track || item.album || `Plex item ${item.rating_key || "unknown"}`;
    return `<li>${esc(item.artist || "Plex")} <span>· ${esc(title)}</span></li>`;
  }).join("");
}
function pendingWork() {
  if (!config) return [];
  return Object.entries(config.definitions || {})
    .filter(([name, spec]) => config.version.sync_statuses[name] === "needs_sync" && spec.enabled !== false)
    .map(([name]) => name);
}
function updateActions() {
  const names = pendingWork();
  const button = $("syncPending");
  button.textContent = names.length ? `Sync ${names.length} pending` : "Nothing to sync";
  button.disabled = syncing || editorDirty || names.length === 0;
  $("bulkSummary").textContent = names.length ? `${names.length} pending` : "";
  $("bulkPanel").hidden = !syncing && names.length === 0 && $("bulkErrors").textContent === "";
  for (const id of ["save", "reload", "importPack"]) $(id).disabled = syncing;
  $("yaml").disabled = syncing;
  document.querySelectorAll(".build").forEach(button => {
    button.disabled = syncing || button.closest(".playlist")?.dataset.disabled === "true";
  });
}
function applyListFilters() {
  const query = $("searchPlaylists").value.trim().toLocaleLowerCase();
  const pendingOnly = $("onlyPending").checked;
  let visible = 0;
  for (const row of $("cards").querySelectorAll(".playlist")) {
    const show = row.dataset.name.toLocaleLowerCase().includes(query)
      && (!pendingOnly || row.dataset.status === "needs_sync");
    row.hidden = !show;
    if (show) visible++;
  }
  $("listHint").textContent = `${visible} / ${Object.keys(config?.definitions || {}).length}`;
  $("expandAll").textContent = "Expand all";
}
function renderCards(definitions, statuses={}) {
  const cards = $("cards");
  cards.innerHTML = "";
  const entries = Object.entries(definitions || {});
  if (!entries.length) {
    cards.innerHTML = '<div class="empty">No playlists defined.</div>';
    applyListFilters();
    updateActions();
    return;
  }
  for (const [name, spec] of entries) {
    const items = spec.items || [];
    const status = statuses[name] || "unverified";
    const disabled = spec.enabled === false;
    const label = disabled ? "Disabled" : status === "needs_sync" ? "Pending"
      : status === "synced" ? "Synced" : "Unverified";
    const row = document.createElement("details");
    row.className = "playlist";
    row.dataset.name = name;
    row.dataset.status = status;
    row.dataset.disabled = String(disabled);
    row.innerHTML = `
      <summary>
        <span class="playlist-name">${esc(name)}</span>
        <span class="playlist-meta">${items.length} item${items.length === 1 ? "" : "s"}</span>
        <span class="chip ${disabled ? "" : status}">${label}</span>
      </summary>
      <div class="playlist-body">
        ${spec.description ? `<div class="description">${esc(spec.description)}</div>` : ""}
        <ul>${cardItems(items)}</ul>
        ${items.length > 5 ? `<div class="more">+ ${items.length - 5} more items</div>` : ""}
        <button class="primary build" ${disabled ? "disabled" : ""}>${status === "needs_sync" ? "Sync" : "Sync again"}</button>
        <div class="result" role="status"></div>
      </div>`;
    const button = row.querySelector(".build");
    const result = row.querySelector(".result");
    button.onclick = async () => {
      if (syncing || disabled) return;
      if (editorDirty) {
        showNotice("Save or discard your unsaved YAML editor changes before syncing. Plex uses the saved version.", true);
        return;
      }
      syncing = true;
      updateActions();
      result.className = "result info";
      result.textContent = "Matching tracks and syncing…";
      try {
        const data = await api("/api/sync/" + encodeURIComponent(name), {method:"POST"});
        if (data.status === "synced") {
          const missing = (data.matches || []).filter(x => x.status !== "matched");
          await loadConfig();
          showNotice(`"${name}" sent to Plex: ${data.track_count} tracks.${missing.length ? ` ${missing.length} items were missing.` : ""}`);
        } else {
          result.className = "result bad";
          result.textContent = data.message || "Plex playlist was not changed.";
        }
      } catch(e) {
        result.className = "result bad";
        result.textContent = "Sync failed: " + e.message;
      } finally {
        syncing = false;
        updateActions();
      }
    };
    cards.appendChild(row);
  }
  applyListFilters();
  updateActions();
}
function markRowSynced(name) {
  if (!config) return;
  config.version.sync_statuses[name] = "synced";
  const count = config.version.counts;
  count.needs_sync = Math.max(0, count.needs_sync - 1);
  count.synced += 1;
  const row = [...$("cards").querySelectorAll(".playlist")].find(node => node.dataset.name === name);
  if (row) {
    row.dataset.status = "synced";
    const chip = row.querySelector(".chip");
    if (chip) {
      chip.className = "chip synced";
      chip.textContent = "Synced";
    }
    const button = row.querySelector(".build");
    if (button) button.textContent = "Sync again";
  }
  renderVersion(config.version);
  applyListFilters();
}
async function loadConfig() {
  config = await api("/api/config");
  $("yaml").value = config.text;
  editorDirty = false;
  $("saveState").textContent = "";
  renderVersion(config.version);
  renderCards(config.definitions, config.version.sync_statuses);
}
async function checkHealth() {
  try {
    const d = await api("/api/health");
    $("health").className = "status good";
    $("health").innerHTML = `<span class="dot"></span><span>${esc(d.server)} · ${esc(d.library)}</span>`;
  } catch(e) {
    $("health").className = "status bad";
    $("health").innerHTML = `<span class="dot"></span><span>Plex connection failed: ${esc(e.message)}</span>`;
  }
}
$("recentMode").addEventListener("change", () => {
  const albums = $("recentMode").value === "albums";
  const input = $("recentLimit");
  input.value = albums ? "20" : "48";
  input.max = albums ? "200" : "8760";
  input.setAttribute("aria-label", albums ? "Number of albums" : "Number of hours");
});
$("searchPlaylists").addEventListener("input", applyListFilters);
$("onlyPending").addEventListener("change", applyListFilters);
$("expandAll").onclick = () => {
  const visible = [...$("cards").querySelectorAll(".playlist")].filter(row => !row.hidden);
  const expand = visible.some(row => !row.open);
  visible.forEach(row => row.open = expand);
  $("expandAll").textContent = expand ? "Collapse all" : "Expand all";
};
$("stopSync").onclick = () => {
  stopRequested = true;
  $("stopSync").disabled = true;
  $("bulkCurrent").textContent += " · Stop requested; finishing current playlist.";
};
async function syncPendingPlaylists({fromImport=false, filename=""}={}) {
  if ((!fromImport && syncing) || editorDirty || !config) return;
  const names = pendingWork();
  if (!names.length) {
    if (fromImport) {
      syncing = false;
      updateActions();
      showNotice(`Imported "${filename}". Nothing to sync.`);
    }
    return;
  }
  const loadedId = config.version.id;
  syncing = true;
  stopRequested = false;
  updateActions();
  $("bulkProgress").hidden = false;
  $("stopSync").disabled = false;
  $("stopSync").hidden = false;
  $("bulkBar").max = names.length;
  $("bulkBar").value = 0;
  $("bulkErrors").textContent = "";
  clearNotice();

  const failures = [];
  let done = 0;
  let skipped = 0;
  let processed = 0;
  for (const name of names) {
    if (stopRequested) break;
    $("bulkCurrent").textContent = `Syncing ${processed + 1} / ${names.length}: ${name}`;
    try {
      const data = await api("/api/sync-pending/" + encodeURIComponent(name), {
        method:"POST", headers:{"Content-Type":"application/json"},
        body:JSON.stringify({version_id:loadedId})
      });
      if (data.status === "synced") {
        done++;
        markRowSynced(name);
        const missing = (data.matches || []).filter(x => x.status !== "matched");
        if (missing.length) failures.push(`${name}: synced with ${missing.length} missing item(s).`);
      } else if (data.status === "skipped") {
        skipped++;
      } else {
        failures.push(`${name}: ${data.message || data.status || "sync unsuccessful"}`);
      }
    } catch(e) {
      failures.push(`${name}: ${e.message}`);
      if (e.message.includes("loaded playlist version changed")) stopRequested = true;
    }
    processed++;
    $("bulkBar").value = processed;
    $("bulkCurrent").textContent = `${processed} / ${names.length} processed · ${done} synced · ${failures.length} warnings/errors`;
    $("bulkErrors").textContent = failures.join("\n");
  }
  const stopped = processed < names.length;
  $("stopSync").disabled = true;
  $("stopSync").hidden = true;
  try {
    await loadConfig();
  } catch(e) {
    failures.push("Could not refresh playlist status: " + e.message);
  } finally {
    syncing = false;
    updateActions();
  }
  $("bulkCurrent").textContent = `${done} synced · ${skipped} skipped · ${failures.length} warnings/errors${stopped ? ` · Stopped after ${processed} of ${names.length}` : ""}`;
  $("bulkErrors").textContent = failures.join("\n");
  $("bulkProgress").hidden = failures.length === 0 && !stopped;
  updateActions();
  showNotice(`${fromImport ? `Imported "${filename}". ` : ""}${done} synced · ${skipped} skipped · ${failures.length} errors${stopped ? " · stopped" : ""}`, Boolean(failures.length));
}
$("syncPending").onclick = () => syncPendingPlaylists();
$("yaml").addEventListener("input", () => {
  editorDirty = Boolean(config) && $("yaml").value !== config.text;
  $("saveState").textContent = editorDirty ? "Unsaved changes - cards still show the saved version." : "";
  updateActions();
});
$("save").onclick = async () => {
  $("saveState").textContent = "Saving…";
  try {
    await api("/api/config", {method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({text:$("yaml").value})});
    await loadConfig();
    showNotice("YAML saved.");
  } catch(e) { $("saveState").textContent = "Error: " + e.message; }
};
$("reload").onclick = () => loadConfig().catch(e => $("saveState").textContent = "Error: " + e.message);

$("importPack").onclick = () => {
  if (syncing) return;
  if (editorDirty) {
    showNotice("Save or discard your unsaved YAML editor changes before importing another version.", true);
    return;
  }
  $("packFile").click();
};
$("packFile").onchange = async () => {
  const file = $("packFile").files[0];
  if (!file) return;
  // An import is one transaction from the user's perspective: validate,
  // persist the pack, and sync changed playlists. Lock the editor throughout.
  if (syncing || editorDirty) {
    $("packFile").value = "";
    showNotice("Finish the current operation or save editor changes before importing.", true);
    return;
  }
  syncing = true;
  updateActions();
  let imported = false;
  try {
    showNotice(`Validating "${file.name}"…`);
    const text = await file.text();
    await api("/api/inspect-config", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({text})
    });
    // A failed validation never reaches this write operation.
    showNotice(`Importing "${file.name}"…`);
    const result = await api("/api/import-config", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({text,filename:file.name})
    });
    imported = true;
    await loadConfig();
    showNotice(`Imported "${file.name}" · ${result.comparison.new.length} new · ${result.comparison.updated.length} updated. Syncing…`);
    await syncPendingPlaylists({fromImport:true,filename:file.name});
  } catch(e) {
    showNotice(imported
      ? `"${file.name}" was imported, but could not finish Plex syncing: ${e.message}. Use the sync button to retry.`
      : `Import rejected: ${e.message}. Saved playlists were not changed.`, true);
  } finally {
    // Allow the same file to be picked again for retry.
    $("packFile").value = "";
    syncing = false;
    updateActions();
  }
};
checkHealth();
loadConfig().catch(e => { $("cards").innerHTML = `<div class="empty">Could not load playlists: ${esc(e.message)}</div>`; });
</script>
</body>
</html>
