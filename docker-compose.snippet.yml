services:
  plex-playlist-manager:
    build:
      context: ./plex-playlist-manager
    container_name: plex-playlist-manager
    ports:
      - "5051:8000"
    environment:
      TZ: ${TZ}
      PLEX_URL: https://host.docker.internal:32400
      PLEX_VERIFY_SSL: "false"
      PLEX_LIBRARY: Music
      PLAYLISTS_FILE: /data/playlists.yml
      # Audio analysis is read-only. AudioMuse runs separately on host port 8098.
      AUDIOMUSE_URL: http://host.docker.internal:8098
      AUDIOMUSE_API_TOKEN_FILE: /run/secrets/audiomuse_api_token
      # Internal Docker DNS for server-to-server album queue submissions.
      YTDLP_SERVER_URL: http://yt-dlp-server:4545
      # Browser-reachable address shown after a successful enqueue.
      YTDLP_PUBLIC_URL: /downloads
      DOWNLOAD_BRIDGE_SCAN_ENABLED: "1"
      # PLEX_TOKEN is optional because the Plex config is mounted read-only below.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /srv/plex-playlist-manager:/data
      - /srv/plex/config:/plex-config:ro
      # Private token file created by the CLI probe; do not copy into image/Git.
      - /home/tom/.config/plex-playlist-manager/audiomuse-api-token:/run/secrets/audiomuse_api_token:ro
    restart: unless-stopped
